<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f10">
<title>Taksi</title>
<style>
:root{--y:#FFC20E;--y2:#FFD84D;--bg:#0f0f10;--card:#1a1a1d;--line:#2c2c31;--txt:#f5f5f6;--mut:#a3a3ad;--red:#ef4444;--green:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--txt);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));background:linear-gradient(180deg,#151517,#0f0f10);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;border-radius:12px;background:var(--y);display:grid;place-items:center;font-size:24px;flex:0 0 auto;
  background-image:repeating-linear-gradient(90deg,#111 0 6px,transparent 6px 12px);background-size:100% 6px;background-repeat:no-repeat;background-position:bottom}
.b1{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b2{font-size:12px;color:var(--mut)}
select#lang{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
main{flex:1;width:100%;max-width:480px;margin:0 auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.screen{display:flex;flex-direction:column;gap:14px}
#sLoading,#sError{align-items:center;text-align:center;padding-top:60px}
.spin{width:42px;height:42px;border:4px solid var(--line);border-top-color:var(--y);border-radius:50%;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.big-ico{font-size:56px;line-height:1}
.mut{color:var(--mut)}
.pickup{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--y);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.pickup span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.pickup strong{font-size:18px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:14px;font-weight:600}
.fld small{font-size:12px;color:var(--mut)}
input[type=text],input[type=tel],textarea{width:100%;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px;font-family:inherit;outline:none;resize:none}
input:focus,textarea:focus{border-color:var(--y)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4;color:#d4d4d8}
.chk input{width:22px;height:22px;flex:0 0 auto;accent-color:var(--y);margin-top:1px}
.chk a{color:var(--y)}
.ferr{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5;border-radius:12px;padding:12px 14px;font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;font-family:inherit}
.btn.main{background:var(--y);color:#111;font-size:20px;font-weight:900;letter-spacing:.04em;padding:20px;box-shadow:0 8px 30px rgba(255,194,14,.25)}
.btn.main:active{transform:scale(.98)}
.btn.main[disabled]{opacity:.6}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:transparent;color:#fca5a5;border:1px solid rgba(239,68,68,.5)}
.st{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:18px 0 6px}
.st h2{font-size:22px;line-height:1.25}
.pulse{width:110px;height:110px;border-radius:50%;background:rgba(255,194,14,.12);display:grid;place-items:center;position:relative;margin-bottom:6px}
.pulse::before,.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--y);animation:pl 2s ease-out infinite;opacity:0}
.pulse::after{animation-delay:1s}
@keyframes pl{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.pulse span{font-size:50px}
.info{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.plate{display:flex;align-self:center;border:3px solid #111;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.plate-tr{background:#003399;color:#fff;width:34px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-weight:800;font-size:13px}
.plate-no{color:#111;font-weight:900;font-size:34px;letter-spacing:.06em;padding:8px 16px;font-family:"Arial Narrow",Arial,sans-serif;white-space:nowrap}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.row span{color:var(--mut);font-size:14px}
.row strong{font-size:17px;text-align:right}
.eta strong{color:var(--y);font-size:22px}
.eta small{display:block;color:var(--mut);font-size:12px;font-weight:500}
.cbox{display:flex;flex-direction:column;gap:6px;align-items:center}
.cbox small{color:var(--mut);font-size:12px}
.late{background:rgba(255,194,14,.08);border:1px solid rgba(255,194,14,.35);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:center;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.5;max-height:80vh;overflow:auto}
.mbox h3{font-size:18px}
.fares{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fares .fh{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.fares .fr{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:6px 0;border-top:1px dashed var(--line)}
.fares .fr:first-of-type{border-top:0}
.fares .fr b{color:var(--y);white-space:nowrap}
.fares small{font-size:11px;color:var(--mut);line-height:1.4}
footer{text-align:center;font-size:11px;color:#55555c;padding:0 0 calc(14px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<div id="bootErr" style="display:none;position:fixed;inset:0;z-index:99999;background:#111;color:#f5f5f5;font:15px/1.6 system-ui,Arial,sans-serif;padding:28px;overflow:auto"></div>
<script>
(function(){
  function show(m){
    if (window.__appReady) return;
    var b = document.getElementById("bootErr"); if (!b) return;
    var fileHint = location.protocol === "file:" ? "<p style='margin-top:12px;color:#fde68a'>Not: Sayfayı doğrudan bilgisayardan açtınız. index.html, durak.html, yonetim.html, firebase-config.js ve demo.js dosyalarının <b>aynı klasörde</b> olduğundan emin olun.</p>" : "";
    b.innerHTML = "<div style='max-width:640px;margin:0 auto'><div style='font-size:42px'>⚠️</div><h2 style='margin:8px 0 12px'>Sayfa başlatılamadı</h2><div style='background:#222;border:1px solid #444;border-radius:10px;padding:12px;font-family:monospace;font-size:13px;white-space:pre-wrap'>" + String(m).replace(/</g,"&lt;") + "</div>" + fileHint + "<p style='margin-top:12px;color:#aaa'>İnternet bağlantınızı ve firebase-config.js dosyasını kontrol edin. Firebase kurulmadan denemek için firebase-config.js içindeki apiKey değerini \"BURAYA_API_KEY\" olarak bırakın; sistem demo modunda açılır.</p></div>";
    b.style.display = "block";
  }
  window.__bootFail = show;
  window.addEventListener("error", function(e){ show(e.message || "Bilinmeyen hata"); });
  window.addEventListener("unhandledrejection", function(e){ var r = e.reason; show(r && (r.message || r.code) || String(r)); });
  setTimeout(function(){ show("Sayfa 12 saniye içinde başlatılamadı. İnternet bağlantısı olmayabilir ya da Firebase'e ulaşılamıyor olabilir."); }, 12000);
})();
</script>
<script src="firebase-config.js"></script>
<script src="demo.js"></script>
<header class="top">
  <div class="brand">
    <div class="logo">🚕</div>
    <div style="min-width:0"><div class="b1" id="hDurak">TAXI</div><div class="b2" id="hNokta"></div></div>
  </div>
  <select id="lang" aria-label="Language"></select>
</header>

<main>
  <section id="sLoading" class="screen"><div class="spin"></div><p class="mut" data-i="loading"></p></section>

  <section id="sError" class="screen hidden">
    <div class="big-ico">⚠️</div>
    <p id="errText" style="font-size:17px"></p>
    <div id="errPhone" style="width:100%"></div>
  </section>

  <section id="sForm" class="screen hidden">
    <div class="pickup"><span data-i="pickup"></span><strong id="fNokta"></strong></div>
    <div id="fareBox"></div>
    <label class="fld"><span data-i="name"></span><input id="iIsim" type="text" autocomplete="name" maxlength="60"></label>
    <label class="fld"><span data-i="phone"></span>
      <input id="iTel" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="+90 5xx xxx xx xx">
      <small data-i="phoneHint"></small></label>
    <label class="fld"><span data-i="note"></span><textarea id="iNot" rows="2" maxlength="200" data-ph="notePh"></textarea></label>
    <label class="chk"><input type="checkbox" id="iKonum" checked><span data-i="shareLoc"></span></label>
    <label class="chk"><input type="checkbox" id="iKvkk"><span><span data-i="consent"></span> <a href="#" id="lnkPriv" data-i="privacyLink"></a></span></label>
    <div id="fErr" class="ferr hidden"></div>
    <button id="btnCall" class="btn main" type="button"><span id="btnCallTxt" data-i="call"></span></button>
  </section>

  <section id="sTrack" class="screen hidden"></section>
</main>
<footer id="foot"></footer>

<div id="mPriv" class="modal hidden">
  <div class="mbox">
    <h3 data-i="privacyTitle"></h3>
    <p id="privText"></p>
    <button class="btn ghost" id="btnPrivClose" data-i="close"></button>
  </div>
</div>

function detectLang(){
  const saved = localStorage.getItem("taksi_dil");
  if (saved && T[saved]) return saved;
  const list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
  for (const l of list){
    let c = String(l).toLowerCase().slice(0,2);
    if (c === "cz") c = "cs";
    if (T[c]) return c;
  }
  return "en";
}
let lang = detectLang();
const t = (k, v={}) => { let s = (T[lang] && T[lang][k]) ?? T.en[k] ?? k; for (const x in v) s = s.split("{"+x+"}").join(v[x]); return s; };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const sel = $("lang");
sel.innerHTML = Object.entries(LANGS).map(([k,v]) => `<option value="${k}">${v}</option>`).join("");
sel.value = lang;
sel.onchange = () => { lang = sel.value; localStorage.setItem("taksi_dil", lang); applyI18n(); };

function fareHtml(){
  const u = nokta && nokta.ucretler ? Object.values(nokta.ucretler) : [];
  if (!u.length) return "";
  u.sort((a, b) => (a.sira ?? a.ucret) - (b.sira ?? b.ucret));
  const nf = new Intl.NumberFormat("tr-TR");
  return `<div class="fares"><div class="fh">💶 ${esc(t("faresTitle"))}</div>` +
    u.map(x => `<div class="fr"><span>${esc(x.hedef)}</span><b>~${nf.format(x.ucret)} ₺</b></div>`).join("") +
    `<small>${esc(t("faresNote"))}</small></div>`;
}
function applyI18n(){
  document.documentElement.lang = lang;
  document.title = t("title");
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = t(el.dataset.i));
  document.querySelectorAll("[data-ph]").forEach(el => el.placeholder = t(el.dataset.ph));
  $("privText").textContent = t("privacyText", { durak: durak ? durak.ad : "" });
  $("fareBox").innerHTML = fareHtml();
  if (cur) renderTrack(); else if (errKey) showError(errKey);
}

/* ---------------- Firebase ---------------- */
const app = initializeApp(firebaseConfig, "yolcu"); // her sayfa ayrı oturum
const auth = getAuth(app);
const db = getDatabase(app);

const P = new URLSearchParams(location.search);
const D = P.get("d") || (DEMO ? "demo-durak" : null), N = P.get("n") || (DEMO ? "n1" : null);
const AK = "taksi_aktif_" + D;

let uid = null, durak = null, nokta = null, durakAktif = false;
let cur = null, curId = null, unsubCall = null, offset = 0, errKey = null, offline = false;

onValue(ref(db, ".info/serverTimeOffset"), s => { offset = s.val() || 0; });
const now = () => Date.now() + offset;

function show(id){
  window.__appReady = true;
  ["sLoading","sError","sForm","sTrack"].forEach(x => $(x).classList.toggle("hidden", x !== id));
}
function phoneBtn(){
  if (!durak || !durak.telefon) return "";
  const tel = durak.telefon.replace(/[^\d+]/g, "");
  return `<a class="btn ghost" href="tel:${esc(tel)}">📞 ${esc(t("callStation"))} · ${esc(durak.telefon)}</a>`;
}
function showError(key){
  errKey = key;
  $("errText").textContent = t(key);
  $("errPhone").innerHTML = key === "invalid" ? "" : phoneBtn();
  show("sError");
}
function showFormOrClosed(){
  if (curId) return;
  if (!durakAktif){ showError("closed"); return; }
  errKey = null;
  show("sForm");
}

applyI18n();
if (DEMO) window.DemoFB.banner("<a style='color:#111;font-weight:800' href='panel.html' target='_blank'>Durak / yönetim paneli</a>");
init();

async function init(){
  if (!D || !N){ showError("invalid"); return; }
  try{
    const u = await new Promise(res => { const un = onAuthStateChanged(auth, x => { un(); res(x); }); });
    uid = u ? u.uid : (await signInAnonymously(auth)).user.uid;
    const [ds, ns] = await Promise.all([ get(ref(db, `duraklar/${D}`)), get(ref(db, `noktalar/${D}/${N}`)) ]);
    if (!ds.exists() || !ns.exists()){ showError("invalid"); return; }
    durak = ds.val(); nokta = ns.val();
  }catch(e){ console.error(e); showError("errGeneric"); return; }

  $("hDurak").textContent = durak.ad;
  $("hNokta").textContent = "📍 " + nokta.ad;
  $("fNokta").textContent = nokta.ad;
  $("foot").textContent = durak.ad + (durak.telefon ? " · " + durak.telefon : "");
  applyI18n();

  // Önceki bilgileri doldur
  try{ const b = JSON.parse(localStorage.getItem("taksi_bilgi") || "{}"); if (b.tel) $("iTel").value = b.tel; if (b.isim) $("iIsim").value = b.isim; }catch(e){}

  const aktifId = localStorage.getItem(AK);
  if (aktifId) track(aktifId);

  onValue(ref(db, `duraklar/${D}/aktif`), s => { durakAktif = s.val() === true; showFormOrClosed(); });
}

/* ---------------- Form ---------------- */
$("lnkPriv").onclick = e => { e.preventDefault(); $("mPriv").classList.remove("hidden"); };
$("btnPrivClose").onclick = () => $("mPriv").classList.add("hidden");
$("mPriv").onclick = e => { if (e.target.id === "mPriv") $("mPriv").classList.add("hidden"); };

function ferr(key){ const el = $("fErr"); if (!key){ el.classList.add("hidden"); return; } el.textContent = t(key); el.classList.remove("hidden"); }
function busy(on, key){
  const b = $("btnCall"); b.disabled = on;
  $("btnCallTxt").textContent = on ? t(key) : t("call");
}
function getPos(){
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
      () => res(null),
      { enableHighAccuracy: true, timeout: 7000, maximumAge: 60000 }
    );
  });
}

$("btnCall").onclick = async () => {
  ferr(null);
  const tel = $("iTel").value.trim();
  const digits = tel.replace(/\D/g, "");
  if (digits.length < 7 || digits.length > 15 || !/^\+?[0-9 ()\-]{6,20}$/.test(tel)) return ferr("errPhone");
  if (!$("iKvkk").checked) return ferr("errConsent");
  const last = +localStorage.getItem("taksi_son") || 0;
  if (Date.now() - last < 60000) return ferr("errRate");

  unlockAudio();
  let pos = null;
  if ($("iKonum").checked){ busy(true, "locating"); pos = await getPos(); }
  busy(true, "sending");

  const key = push(ref(db, `cagrilar/${D}`)).key;
  const data = { yolcuUid: uid, noktaId: N, noktaAd: nokta.ad, telefon: tel, dil: lang, durum: "bekliyor", olusturma: serverTimestamp() };
  const isim = $("iIsim").value.trim(), not = $("iNot").value.trim();
  if (isim) data.isim = isim.slice(0, 60);
  if (not) data.not = not.slice(0, 200);
  if (pos){ data.lat = pos.lat; data.lng = pos.lng; data.dogruluk = Math.round(pos.acc); }

  try{
    await update(ref(db), { [`cagrilar/${D}/${key}`]: data, [`yolcuSon/${uid}`]: serverTimestamp() });
  }catch(e){
    console.error(e);
    busy(false);
    const a = await get(ref(db, `duraklar/${D}/aktif`)).catch(() => null);
    if (a && a.val() !== true){ durakAktif = false; showFormOrClosed(); return; }
    return ferr(String(e && e.message || "").toLowerCase().includes("permission") ? "errRate" : "errGeneric");
  }
  localStorage.setItem("taksi_son", String(Date.now()));
  localStorage.setItem("taksi_bilgi", JSON.stringify({ tel, isim }));
  $("iNot").value = "";
  busy(false);
  track(key);
};

/* ---------------- Takip ---------------- */
const FINAL = ["gonderildi", "reddedildi", "iptal"];

function track(id){
  curId = id;
  localStorage.setItem(AK, id);
  if (offline){ goOnline(db); offline = false; }
  if (unsubCall) unsubCall();
  unsubCall = onValue(ref(db, `cagrilar/${D}/${id}`), s => {
    if (!s.exists()){ endTrack(); return; }
    const prev = cur && cur.durum;
    cur = s.val();
    if (FINAL.includes(cur.durum) && now() - (cur.olusturma || 0) > 2 * 3600e3){ endTrack(); return; }
    if (prev && prev !== cur.durum && (cur.durum === "onaylandi" || cur.durum === "gonderildi")) ding();
    renderTrack();
    show("sTrack");
    if (FINAL.includes(cur.durum)){
      // bağlantıyı boşa açık tutma (ücretsiz plan eşzamanlı bağlantı sınırı)
      setTimeout(() => { if (cur && FINAL.includes(cur.durum) && !offline){ goOffline(db); offline = true; } }, 8000);
    }
  }, err => { console.error(err); endTrack(); });
}
function endTrack(){
  if (unsubCall){ unsubCall(); unsubCall = null; }
  localStorage.removeItem(AK);
  cur = null; curId = null;
  if (offline){ goOnline(db); offline = false; }
  showFormOrClosed();
}

function fmtTime(ms){
  try{ return new Date(ms).toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit" }); }
  catch(e){ return new Date(ms).toTimeString().slice(0,5); }
}
function infoBlock(c){
  const etaAt = c.onayZamani && c.eta ? fmtTime(c.onayZamani + c.eta * 60000) : "";
  return `<div class="info">
    <div class="plate"><div class="plate-tr">TR</div><div class="plate-no">${esc(c.plaka || "")}</div></div>
    ${c.sofor ? `<div class="row"><span>${esc(t("driver"))}</span><strong>${esc(c.sofor)}</strong></div>` : ""}
    ${c.eta ? `<div class="row eta"><span>${esc(t("eta"))}</span><strong>~${c.eta} ${esc(t("min"))}${etaAt ? `<small>${esc(t("around", { t: etaAt }))}</small>` : ""}</strong></div>` : ""}
    <div class="row"><span>${esc(t("pickup"))}</span><strong>${esc(c.noktaAd || "")}</strong></div>
  </div>`;
}
const cancelBlock = () => `<div id="cBox" class="cbox hidden"><button class="btn danger" data-act="cancel">${esc(t("cancel"))}</button><small id="cLeft"></small></div>`;

function renderTrack(){
  const c = cur; if (!c) return;
  let h = "";
  switch (c.durum){
    case "bekliyor":
      h = `<div class="st"><div class="pulse"><span>🚕</span></div><h2>${esc(t("waitingTitle"))}</h2><p class="mut">${esc(t("waitingText"))}</p></div>
           <div class="pickup"><span>${esc(t("pickup"))}</span><strong>${esc(c.noktaAd || "")}</strong></div>
           ${cancelBlock()}${fareHtml()}
           <div id="lBox" class="late hidden"><div>${esc(t("noAnswer"))}</div>${phoneBtn()}</div>`;
      break;
    case "onaylandi":
      h = `<div class="st"><div class="big-ico">✅</div><h2>${esc(t("approvedTitle"))}</h2></div>${infoBlock(c)}${cancelBlock()}${fareHtml()}`;
      break;
    case "gonderildi":
      h = `<div class="st"><div class="big-ico">🚖</div><h2>${esc(t("dispatchedTitle"))}</h2><p class="mut">${esc(t("dispatchedText"))}</p></div>
           ${infoBlock(c)}<button class="btn ghost" data-act="new">${esc(t("newCall"))}</button>`;
      break;
    case "reddedildi":
      h = `<div class="st"><div class="big-ico">😔</div><h2>${esc(t("rejectedTitle"))}</h2><p class="mut">${esc(t("r_" + (c.redSebebi || "diger")))}</p></div>
           ${phoneBtn()}<button class="btn main" data-act="new">${esc(t("tryAgain"))}</button>`;
      break;
    case "iptal":
      h = `<div class="st"><div class="big-ico">🚫</div><h2>${esc(t("cancelledTitle"))}</h2></div>
           <button class="btn main" data-act="new">${esc(t("newCall"))}</button>`;
      break;
  }
  $("sTrack").innerHTML = h;
  tick();
}

function tick(){
  if (!cur) return;
  const n = now();
  const cb = $("cBox");
  if (cb){
    const left = Math.ceil(((cur.olusturma || n) + 60000 - n) / 1000);
    if (left > 0 && (cur.durum === "bekliyor" || cur.durum === "onaylandi")){
      cb.classList.remove("hidden");
      $("cLeft").textContent = t("cancelLeft", { s: left });
    } else cb.classList.add("hidden");
  }
  const lb = $("lBox");
  if (lb) lb.classList.toggle("hidden", n - (cur.olusturma || n) < 180000);
}
setInterval(tick, 1000);

$("sTrack").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "cancel"){
    if (!confirm(t("confirmCancel"))) return;
    b.disabled = true;
    try{ await update(ref(db, `cagrilar/${D}/${curId}`), { durum: "iptal", iptalZamani: serverTimestamp() }); }
    catch(err){ console.error(err); b.disabled = false; alert(t("errGeneric")); }
  } else if (act === "new"){
    endTrack();
  }
});

/* ---------------- Ses / titreşim ---------------- */
let actx = null;
function unlockAudio(){
  try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); }catch(e){}
}
function ding(){
  try{ navigator.vibrate && navigator.vibrate([200, 100, 200]); }catch(e){}
  try{
    if (!actx) return;
    [0, 0.18].forEach((w, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = i ? 1318 : 988;
      g.gain.setValueAtTime(0.4, actx.currentTime + w);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + w + 0.35);
      o.connect(g).connect(actx.destination);
      o.start(actx.currentTime + w); o.stop(actx.currentTime + w + 0.4);
    });
  }catch(e){}
}
